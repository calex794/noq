name: Akula lab baseline (noq)

on:
  push:
    branches:
      - "lab/**"
      - "repro/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-noq-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Rust - check, QUIC unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Show source versions
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Formatting (upstream baseline, report only)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Check QUIC crates
        run: cargo check --locked -p noq -p noq-proto -p noq-udp
      - name: Run QUIC state machine unit tests
        run: cargo test --locked -p noq-proto --lib -- --test-threads=4
      - name: Run noq unit tests
        run: cargo test --locked -p noq --lib -- --test-threads=4

# Do not confuse unit tests with the cross-repository Iroh/Noq patchbay suite.
