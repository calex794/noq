name: Akula incremental scheduler experiment
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/noq-incremental-scheduling-20261018
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Protocol compilation
        run: cargo check --locked -p noq-proto
      - name: Stream fairness
        run: cargo test --locked -p noq-proto --lib same_stream_priority -- --nocapture
      - name: Path affinity scenarios
        run: cargo test --locked -p noq-proto --lib stream_affinity_ -- --nocapture
      - name: Large payload with forced packet loss
        run: cargo test --locked -p noq-proto --lib akula_bulk_payload_loss_recovery -- --nocapture
      - name: Multipath regressions
        run: cargo test --locked -p noq-proto --lib tests::multipath -- --nocapture
