name: Akula stream affinity targeted
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/noq-stream-affinity-20261018

permissions:
  contents: read

jobs:
  affinity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: All stream affinity regression scenarios
        run: cargo test --locked -p noq-proto --lib stream_affinity_ -- --nocapture
      - name: Priority ordering
        run: cargo test --locked -p noq-proto --lib stream_priority -- --nocapture
      - name: Equal priority fairness
        run: cargo test --locked -p noq-proto --lib same_stream_priority -- --nocapture
      - name: Full multipath protocol test set
        run: cargo test --locked -p noq-proto --lib tests::multipath -- --nocapture
