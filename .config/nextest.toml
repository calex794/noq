# Be aware that all profils inherit from the default profile unless
# explicitly set to a different profile.

[profile.default]
slow-timeout = { period = "2s", terminate-after = 3 }
fail-fast = false

# Do not run proptests by default. Use --ignore-default-filter to run these anyway.
# To give proptests a proper spin run:
#    cargo nextest run --ignore-default-filter -E 'test(~proptest::)'
# Or use the proptests profile below which has a longer slow-timeout:
#    PROPTEST_CASES=10000 cargo nextest run -P proptests
default-filter = 'not test(~proptests::)'

[profile.proptests]
# Select this profile with -P proptests
# To give proptests a proper spin, run with PROPTEST_CASES=10000
slow-timeout = '300s'
default-filter = 'test(~proptests::)'

[profile.ci]
slow-timeout = { period = "5s", terminate-after = 3 }
fail-fast = false
default-filter = 'all()'

[[profile.ci.overrides]]
filter = 'test(congestion::bbr3)'
platform = 'cfg(target_env = "musl")'
slow-timeout = { period = "5s", terminate-after = 5 }

# The same deterministic simulation has timed out on Ubuntu/GNU with
# nextest's default 15s limit on full main CI (runs 39771098488 and
# 39775021583), including the retry. Keep it enabled and retain warnings;
# only allow this exact test up to 25s on Linux GNU. The separate musl
# BBR3 override above is unchanged.
[[profile.ci.overrides]]
filter = 'test(probe_bw_exits_probe_down_to_probe_cruise_on_inflight)'
platform = 'cfg(all(target_os = "linux", target_env = "gnu"))'
slow-timeout = { period = "5s", terminate-after = 5 }

# The deterministic BBR3 simulator runs close to the default 15s deadline
# on busy Windows runners (observed 14.893s PASS, 15.018s TIMEOUT).
# Keep the test enabled, target only the affected case, and preserve the
# 5s slow-test warnings. A genuine hang still fails after 25s.
[[profile.ci.overrides]]
filter = 'test(probe_bw_exits_probe_down_to_probe_cruise_on_inflight)'
platform = 'cfg(target_os = "windows")'
slow-timeout = { period = "5s", terminate-after = 5 }
